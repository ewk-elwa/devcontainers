# Link the Role to users, groups, or service accounts via a RoleBinding.
# For a group super-air-team:
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: super-air
  name: super-air-access
subjects:
- kind: Group
  name: super-air-team
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: super-air-full-access
  apiGroup: rbac.authorization.k8s.io
